name: Refresh CanopyOps release manifest

on:
  push:
    paths:
      - .github/workflows/refresh-release-manifest.yml

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Remove one-shot workflow and rebuild exact inventory
        run: |
          git rm .github/workflows/refresh-release-manifest.yml
          python canopyops/scripts/build_release_manifest.py . --version 0.1.5
      - name: Commit refreshed manifest
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add release-manifest.json
          git commit -m "chore: refresh release manifest after Pages repair"
          git push
