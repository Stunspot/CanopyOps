name: Clean CanopyOps Pages repair runs

on:
  push:
    paths:
      - .github/workflows/cleanup-pages-repair-runs.yml

permissions:
  actions: write
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Delete only failed or cancelled runs created by this repair
        id: cleanup
        env:
          GH_TOKEN: ${{ github.token }}
          CURRENT_RUN_ID: ${{ github.run_id }}
          REPOSITORY: ${{ github.repository }}
        run: |
          python - <<'PY'
          import json
          import os
          from urllib.request import Request, urlopen

          token = os.environ['GH_TOKEN']
          repo = os.environ['REPOSITORY']
          current = str(os.environ['CURRENT_RUN_ID'])
          cutoff = '2026-07-26T00:00:00Z'
          bad = {'failure', 'cancelled', 'timed_out', 'action_required', 'startup_failure', 'stale'}
          path_markers = (
              '.github/workflows/pages.yml',
              '.github/workflows/verify.yml',
              '.github/workflows/capture-canopyops-hero.yml',
              '.github/workflows/inspect-canopyops-hero.yml',
              '.github/workflows/compact-preview.yml',
              '.github/workflows/refresh-release-manifest.yml',
              '.github/workflows/verify-pages-repair.yml',
          )
          name_markers = (
              'Deploy GitHub Pages',
              'Verify CanopyOps',
              'Generate CanopyOps hero artwork',
              'Inspect CanopyOps hero artwork',
              'Compact image preview',
              'Refresh CanopyOps release manifest',
              'Verify CanopyOps Pages repair',
          )
          headers = {
              'Authorization': f'Bearer {token}',
              'Accept': 'application/vnd.github+json',
              'X-GitHub-Api-Version': '2022-11-28',
              'User-Agent': 'canopyops-pages-repair-cleaner',
          }

          deleted = []
          page = 1
          while True:
              request = Request(
                  f'https://api.github.com/repos/{repo}/actions/runs?per_page=100&page={page}',
                  headers=headers,
              )
              with urlopen(request, timeout=60) as response:
                  payload = json.load(response)
              runs = payload.get('workflow_runs', [])
              if not runs:
                  break
              for run in runs:
                  run_id = str(run.get('id'))
                  if run_id == current or run.get('status') != 'completed':
                      continue
                  if (run.get('created_at') or '') < cutoff:
                      continue
                  conclusion = run.get('conclusion')
                  path = run.get('path') or ''
                  name = run.get('name') or ''
                  ours = any(marker in path for marker in path_markers) or any(name.startswith(marker) for marker in name_markers)
                  if conclusion in bad and ours:
                      delete = Request(
                          f'https://api.github.com/repos/{repo}/actions/runs/{run_id}',
                          headers=headers,
                          method='DELETE',
                      )
                      with urlopen(delete, timeout=60) as response:
                          if response.status != 204:
                              raise RuntimeError(f'Unexpected delete status {response.status} for run {run_id}')
                      deleted.append((run_id, name, conclusion, path))
              if len(runs) < 100:
                  break
              page += 1

          print(f'Deleted {len(deleted)} failed/cancelled repair run(s).')
          for item in deleted:
              print('deleted', *item)
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as output:
              output.write(f'deleted={len(deleted)}\n')
          PY
      - name: Remove cleaner and restore exact release manifest
        run: |
          git rm .github/workflows/cleanup-pages-repair-runs.yml
          python canopyops/scripts/build_release_manifest.py . --version 0.1.5
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add release-manifest.json
          git commit -m "chore: remove Pages repair cleanup after deleting ${{ steps.cleanup.outputs.deleted }} failed run(s)"
          git push
