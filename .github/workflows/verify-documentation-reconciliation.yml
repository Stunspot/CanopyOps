name: Confirm CanopyOps documentation reconciliation

on:
  push:
    paths:
      - .github/workflows/verify-documentation-reconciliation.yml

permissions:
  actions: write
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run current repository suite
        run: python -m unittest discover -s tests -v

      - name: Verify settled portable bundle
        working-directory: releases/v0.1.6
        run: python tools/verify_release.py .

      - name: Delete superseded failed verification run
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          FAILED_RUN_ID: "30184925232"
        run: |
          python - <<'PY'
          import os
          from urllib.request import Request, urlopen

          request = Request(
              f"https://api.github.com/repos/{os.environ['REPOSITORY']}/actions/runs/{os.environ['FAILED_RUN_ID']}",
              method="DELETE",
              headers={
                  "Authorization": f"Bearer {os.environ['GH_TOKEN']}",
                  "Accept": "application/vnd.github+json",
                  "X-GitHub-Api-Version": "2022-11-28",
                  "User-Agent": "canopyops-documentation-cleanup",
              },
          )
          with urlopen(request, timeout=60) as response:
              if response.status != 204:
                  raise RuntimeError(f"Unexpected delete status: {response.status}")
          print("Deleted failed verification run 30184925232 after both substantive checks passed.")
          PY
