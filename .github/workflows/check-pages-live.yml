name: Check CanopyOps Pages live site

on:
  push:
    paths:
      - .github/workflows/check-pages-live.yml

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Probe public site
        id: probe
        shell: bash
        run: |
          status="$(curl --location --silent --show-error --max-time 30 --output /tmp/canopyops-site.html --write-out '%{http_code}' https://stunspot.github.io/CanopyOps/ || true)"
          if [ "$status" = "200" ] && grep -Fq 'CanopyOps · Evidence-Bounded Cultivation Operations' /tmp/canopyops-site.html; then
            result="live-and-current"
          elif [ "$status" = "200" ]; then
            result="live-but-stale-or-unexpected"
          else
            result="not-live-http-$status"
          fi
          echo "result=$result" >> "$GITHUB_OUTPUT"
          echo "Pages probe: $result"
      - name: Remove probe and restore exact manifest
        run: |
          git rm .github/workflows/check-pages-live.yml
          python canopyops/scripts/build_release_manifest.py . --version 0.1.5
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add release-manifest.json
          git commit -m "chore: check CanopyOps Pages (${{ steps.probe.outputs.result }})"
          git push
