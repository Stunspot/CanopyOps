name: Compact image preview

on:
  push:
    paths:
      - .github/workflows/compact-preview.yml

permissions:
  contents: write

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          python -m pip install --quiet pillow
          python - <<'PY'
          from PIL import Image
          image = Image.open('docs/assets/canopyops-hero.png').convert('RGB')
          image.resize((160, 90), Image.Resampling.LANCZOS).save('docs/assets/canopyops-inspection.jpg', 'JPEG', quality=22, optimize=True)
          PY
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/assets/canopyops-inspection.jpg
          git rm .github/workflows/compact-preview.yml
          git commit -m "chore: compact temporary image preview"
          git push
