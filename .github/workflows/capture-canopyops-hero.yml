name: Generate CanopyOps hero artwork

on:
  push:
    paths:
      - .github/workflows/capture-canopyops-hero.yml

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Generate and verify raster artwork
        run: |
          python -m pip install --quiet pillow
          python - <<'PY'
          from io import BytesIO
          from pathlib import Path
          from urllib.parse import quote
          from urllib.request import Request, urlopen
          from PIL import Image, ImageOps, ImageFilter

          prompt = (
              "wide 16:9 text-free premium photorealistic editorial image of a modern lawful controlled-environment "
              "cannabis cultivation room, slightly elevated three-quarter view across orderly healthy canopy rows, "
              "professional irrigation lines and environmental sensor probes visible, disciplined industrial cleanliness, "
              "one crop zone subtly isolated by cool cyan inspection light while warm horticultural fixtures recede into "
              "atmospheric depth, realistic deep green serrated foliage, dark navy structural surfaces, restrained cyan and "
              "amber accents, crisp operational detail with gentle background falloff, generous darker negative space on the "
              "left for separate website typography, evidence-driven cultivation operations and diagnosis rather than lifestyle "
              "glamour, no people, no words, no letters, no logos, no icons, no interface overlays, no charts, no leaf emblem, "
              "no vector art, no infographic, no poster layout"
          )
          encoded = quote(prompt, safe='')
          urls = [
              f"https://pollinations.ai/p/{encoded}?width=1536&height=864&seed=741925&nologo=true&enhance=true",
              f"https://image.pollinations.ai/prompt/{encoded}?width=1536&height=864&seed=741925&nologo=true&enhance=true",
              f"https://gen.pollinations.ai/image/{encoded}?width=1536&height=864&seed=741925&nologo=true",
          ]
          payload = None
          errors = []
          for url in urls:
              try:
                  req = Request(url, headers={
                      'User-Agent': 'Mozilla/5.0 (compatible; canopyops-doc-art/1.0)',
                      'Accept': 'image/avif,image/webp,image/png,image/jpeg,*/*',
                  })
                  with urlopen(req, timeout=240) as response:
                      candidate = response.read()
                  probe = Image.open(BytesIO(candidate))
                  probe.verify()
                  if probe.width < 768 or probe.height < 432:
                      raise ValueError(f'image too small: {probe.size}')
                  payload = candidate
                  break
              except Exception as exc:
                  errors.append(f"{url.split('/')[2]}: {type(exc).__name__}: {exc}")
          if payload is None:
              raise SystemExit('All image routes failed:\n' + '\n'.join(errors))

          image = Image.open(BytesIO(payload)).convert('RGB')
          image = ImageOps.fit(image, (1600, 900), method=Image.Resampling.LANCZOS)
          image = image.filter(ImageFilter.UnsharpMask(radius=1.0, percent=55, threshold=3))
          output = Path('docs/assets/canopyops-hero.png')
          output.parent.mkdir(parents=True, exist_ok=True)
          image.save(output, format='PNG', optimize=True)
          check = Image.open(output)
          if check.format != 'PNG' or check.size != (1600, 900) or output.stat().st_size < 100_000:
              raise SystemExit(f'Raster verification failed: {check.format} {check.size} {output.stat().st_size}')
          print(f'Verified {output}: PNG {check.width}x{check.height}, {output.stat().st_size} bytes')
          PY
      - name: Commit asset and remove one-shot workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/assets/canopyops-hero.png
          git rm .github/workflows/capture-canopyops-hero.yml
          git commit -m "Add generated CanopyOps hero artwork"
          git push
